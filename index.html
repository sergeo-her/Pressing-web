// ---- Accès étanche pressing (marque blanche / multi-tenant) ----
function generateInviteCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function getJoinLink(code){
  const base = (window.location.origin + window.location.pathname).replace(/\/$/,"") || window.location.href.split("?")[0];
  return base + "?join=" + encodeURIComponent(code);
}
function parseJoinFromUrl(){
  try{
    const u = new URL(window.location.href);
    const code = u.searchParams.get("join") || u.searchParams.get("code") || u.searchParams.get("p");
    if(code){
      state.joinCode = String(code).trim().toUpperCase();
      try{ localStorage.setItem("pc_join_code", state.joinCode); }catch(e){}
    } else {
      try{
        const saved = localStorage.getItem("pc_join_code");
        if(saved) state.joinCode = saved;
      }catch(e){}
    }
  } catch(e){}
}
async function resolvePressingByCode(code){
  if(!code) return null;
  const raw = String(code).trim();
  const c = raw.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!c) return null;
  // 1) RPC
  try{
    const { data, error } = await sb.rpc("resolve_pressing_code", { p_code: c });
    if(!error && data){
      const row = Array.isArray(data) ? data[0] : data;
      if(row && row.id) return row;
    }
  } catch(e){}
  // 2) Code invitation exact
  try{
    const { data } = await sb.from("pressings").select("id,name,invite_code,address,phone").eq("invite_code", c).eq("status","active").maybeSingle();
    if(data) return data;
  } catch(e){}
  // 3) Accepte aussi l'UUID (ou début d'UUID) du pressing
  try{
    if(raw.length >= 8){
      const { data: list } = await sb.from("pressings").select("id,name,invite_code,address,phone").eq("status","active").limit(50);
      const found = (list||[]).find(p =>
        String(p.id).toLowerCase() === raw.toLowerCase() ||
        String(p.id).toLowerCase().startsWith(raw.toLowerCase().slice(0,8)) ||
        (p.invite_code && String(p.invite_code).toUpperCase() === c)
      );
      if(found) return found;
    }
  } catch(e){}
  // 4) RPC get by id si UUID complet
  try{
    if(/^[0-9a-f-]{36}$/i.test(raw)){
      const { data: r } = await sb.rpc("get_pressing_public", { p_id: raw });
      const row = Array.isArray(r) ? r[0] : r;
      if(row && row.id) return row;
    }
  } catch(e){}
  return null;
}

function fcfa(n){ return (n||0).toLocaleString("fr-FR") + " FCFA"; }
function nextStatus(cur){ const i = STATUS_FLOW.indexOf(cur); return (i===-1||i===STATUS_FLOW.length-1) ? cur : STATUS_FLOW[i+1]; }
function esc(s){ return String(s==null?"":s).replace(/"/g,"&quot;"); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function timeAgo(dateStr){
  const diff = (Date.now() - new Date(dateStr).getTime())/1000;
  if(diff < 60) return "à l'instant";
  if(diff < 3600) return Math.floor(diff/60) + " min";
  if(diff < 86400) return Math.floor(diff/3600) + " h";
  return Math.floor(diff/86400) + " j";
}

function computeSubStatus(sub){
  if(!sub) return { status:"inconnu", daysLeft:null };
  const today = new Date(todayISO());
  if(sub.manual_status === "suspended") return { status:"suspended", daysLeft:null };
  if(sub.current_period_end){
    const end = new Date(sub.current_period_end);
    const daysLeft = Math.ceil((end-today)/86400000);
    return { status: daysLeft>=0 ? "active" : "expired", daysLeft };
  }
  if(sub.trial_end){
    const end = new Date(sub.trial_end);
    const daysLeft = Math.ceil((end-today)/86400000);
    return { status: daysLeft>=0 ? "trial" : "expired", daysLeft };
  }
  return { status:"expired", daysLeft:null };
}

function clientHasActivePass(profile){
  if(!profile) return false;
  if(profile.pass_type === "unlimited" && profile.pass_expiration){
    return new Date(profile.pass_expiration) > new Date();
  }
  return (profile.pass_credits || 0) > 0;
}
function clientPassSummary(profile){
  if(!profile) return { label:"—", credits:0, unlimited:false, daysLeft:null };
  if(profile.pass_type === "unlimited" && profile.pass_expiration){
    const daysLeft = Math.ceil((new Date(profile.pass_expiration) - new Date())/86400000);
    if(daysLeft >= 0) return { label:"Illimité", credits:null, unlimited:true, daysLeft };
  }
  const credits = profile.pass_credits || 0;
  return { label: credits + " réservation" + (credits>1?"s":""), credits, unlimited:false, daysLeft:null };
}
async function ensureClientPass(profile){
  // Initialise les crédits de bienvenue si les colonnes existent et sont nulles
  if(!profile || profile.role !== "client") return profile;
  const meta = (state.session?.user?.user_metadata) || {};
  const patch = {};
  if(profile.pass_credits == null && profile.pass_type == null){
    patch.pass_credits = PASS_WELCOME_CREDITS;
    patch.pass_type = "free";
    patch.pass_expiration = null;
  }
  // Compléter téléphone / adresses depuis metadata d'inscription si absents en base
  if(!(profile.phone||"").trim() && meta.phone) patch.phone = meta.phone;
  if(!(profile.home_address||"").trim() && meta.home_address) patch.home_address = meta.home_address;
  if(!(profile.work_address||"").trim() && meta.work_address) patch.work_address = meta.work_address;
  if(!(profile.full_name||"").trim() && meta.full_name) patch.full_name = meta.full_name;
  if(Object.keys(patch).length){
    const { data, error } = await sb.from("profiles").update(patch).eq("id", profile.id).select("*").single();
    if(!error && data) return data;

async function deductPassCredit(){
  const p = state.profile;
  if(!p) return false;
  // Illimité actif : pas de décompte
  if(p.pass_type === "unlimited" && p.pass_expiration && new Date(p.pass_expiration) > new Date()){
    return true;
  }
  const credits = p.pass_credits || 0;
  if(credits <= 0) return false;
  const { data, error } = await sb.from("profiles").update({
    pass_credits: credits - 1
  }).eq("id", p.id).select("*").single();
  if(error || !data){ console.error("Décompte crédit:", error); return false; }

async function ensureProfileRow(){
  const uid = state.session?.user?.id;
  if(!uid) return null;
  const meta = state.session.user.user_metadata || {};
  const full_name = meta.full_name || meta.name || (state.session.user.email || "").split("@")[0] || "Utilisateur";
  const phone = meta.phone || null;
  let role = meta.role || "client";
  if(!["client","pressing","agent","admin"].includes(role)) role = "client";

  // 1) RPC SECURITY DEFINER (contourne RLS si installée)
  try{
    const { data: rpcData, error: rpcErr } = await sb.rpc("ensure_my_profile", {
      p_full_name: full_name,
      p_phone: phone,
      p_role: role
    });
    if(!rpcErr && rpcData){
      if(Array.isArray(rpcData) && rpcData[0]) return rpcData[0];
      if(rpcData.id) return rpcData;
    }
    if(rpcErr) console.warn("ensure_my_profile rpc:", rpcErr.message);
  } catch(e){ console.warn(e); }

  // 2) Lecture directe
  let { data, error } = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if(data && !error) return data;

  // 3) Upsert client
  const row = { id: uid, full_name, phone, role, home_address: meta.home_address || null, work_address: meta.work_address || null };
  const up = await sb.from("profiles").upsert(row, { onConflict: "id" }).select("*").maybeSingle();
  if(up.data) return up.data;
  if(up.error) console.warn("profiles upsert:", up.error.message);

  const ins = await sb.from("profiles").insert(row).select("*").maybeSingle();
  if(ins.data) return ins.data;
  if(ins.error) console.warn("profiles insert:", ins.error.message);

  const again = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if(again.data) return again.data;

  state._profileLastError = (up.error && up.error.message) || (ins.error && ins.error.message) || (error && error.message) || "inconnu";
  return null;
}

async function loadProfileAndRoute(retry){
  const attempt = typeof retry === "number" ? retry : 0;
  let data = null;
  try{
    data = await ensureProfileRow();
  } catch(e){
    console.warn("loadProfileAndRoute:", e);
  }
  if(!data){
    if(attempt < 3){
      setTimeout(() => loadProfileAndRoute(attempt + 1), 600 + attempt * 400);
      return;
    }
    const email = state.session?.user?.email || "";
    state.view = "auth";
    const detail = state._profileLastError ? (" Détail: "+state._profileLastError) : "";
    state.authError = "Profil introuvable pour "+email+". Exécute PROFILE_FIX.sql dans Supabase (SQL Editor), puis reconnecte-toi."+detail;
    // Ne pas forcément déconnecter : laisse la session pour retry après SQL
    render();
    return;
  }
  const fresh = freshState();
  fresh.session = state.session; fresh.profile = data; fresh.view = "app";
  // Conserver join code si présent
  try{
    const jc = localStorage.getItem("pc_join_code");
    if(jc){ fresh.joinCode = jc; }
  } catch(e){}
  state = fresh;

  if(data.role === "client"){
    state.profile = await ensureClientPass(data);
    await loadPassSettings();
    await loadClientOrders();
    // Rattachement étanche : home_pressing_id, code URL, ou pressing_customers
    let homeId = state.profile.home_pressing_id || null;
    if(!homeId && state.joinCode){
      const jp = await resolvePressingByCode(state.joinCode);
      if(jp){ await linkClientToPressing(jp.id); homeId = jp.id; state.joinPressing = jp; }
    }
    if(!homeId){
      try{
        const { data: pc } = await sb.from("pressing_customers").select("pressing_id").eq("customer_id", state.profile.id).limit(1).maybeSingle();
        if(pc?.pressing_id){
          homeId = pc.pressing_id;
          try{ await sb.from("profiles").update({ home_pressing_id: homeId }).eq("id", state.profile.id); }catch(e){}
          state.profile.home_pressing_id = homeId;
        }
      } catch(e){}
    }
    state.clientHomePressingId = homeId;
    if(homeId){
      state.selectedPressingId = homeId;
      state.clientScreen = "home";
      await loadClientPressingOnly(homeId);
    } else {
      state.clientScreen = "joinPressing";
      state.pressingsList = [];
    }
  } else if(data.role === "pressing"){
    await loadMyPressing();
    if(!state.myPressing){
      // Auto-création du réseau pressing + essai 30j si le compte existe mais pas encore de fiche
      await ensurePressingForOwner(data);
      await loadMyPressing();
    }
    if(state.myPressing){
      if(!state.myPressing.invite_code){ try{ await ensurePressingInviteCode(); }catch(e){} }
      await Promise.all([loadPressingOrders(), loadPressingAgents(), loadMySubscription(), loadPressingClients()]);
      attachPressingRealtime();
    }
  } else if(data.role === "agent"){
    await loadMyAgent();
    if(state.myAgent) await loadMissions(); else await loadJoinablePressings();
  } else if(data.role === "admin"){
    await Promise.all([loadAdminPressings(), loadAdminPassRequests(), loadPassSettings()]);
  }
  // Nettoyage auto 30j (client / pressing / agent)
  try{ await runRoleAutoCleanup(); }catch(e){ console.warn(e); }
  await loadNotifications();
  if(notifPollTimer) clearInterval(notifPollTimer);
  notifPollTimer = setInterval(loadNotifications, 60000);
  render();
  // Push en différé (ne bloque pas l'affichage)
  setTimeout(() => { try{ ensurePushSubscription(); }catch(e){} }, 2500);
}

  if(role === "client"){

// ---- Nettoyage auto (30 jours) : notifications + cache local ----
const CLEANUP_DAYS_DEFAULT = 30;
const CLOSED_ORDER_STATUSES = ["livre","termine"];

function daysAgoISO(days){
  const d = new Date();
  d.setDate(d.getDate() - (Number(days) || CLEANUP_DAYS_DEFAULT));
  return d.toISOString();
}

/** Nettoyage local (cache navigateur / clés app) — sans toucher au compte */
async function clearLocalAppCache(){
  try{
    const keep = ["pc_push_ok","pc_push_dismiss"];
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith("pc_") && !keep.includes(k)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch(e){}
  try{
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e){}
}

/** Auto pour client / pressing / agent : notifs > 30j + commandes clôturées > 30j (selon rôle) */
async function runRoleAutoCleanup(){
  if(!state.profile) return;
  const role = state.profile.role;
  if(role === "admin") return; // admin : manuel uniquement
  const before = daysAgoISO(CLEANUP_DAYS_DEFAULT);
  try{
    // Notifications personnelles anciennes
    await sb.from("notifications").delete()
      .eq("user_id", state.profile.id)
      .lt("created_at", before);
  } catch(e){ console.warn("cleanup notifs:", e.message); }

  try{
    if(role === "client"){
      await sb.from("orders").delete()
        .eq("customer_id", state.profile.id)
        .in("order_status", CLOSED_ORDER_STATUSES)
        .lt("created_at", before);
    } else if(role === "pressing" && state.myPressing?.id){
      await sb.from("orders").delete()
        .eq("pressing_id", state.myPressing.id)
        .in("order_status", CLOSED_ORDER_STATUSES)
        .lt("created_at", before);
    } else if(role === "agent"){
      // Les agents ne suppriment pas les commandes globales ; rien de plus
    }
  } catch(e){ console.warn("cleanup orders:", e.message); }

  // Cache local au plus une fois par jour
  try{
    const key = "pc_cleanup_day";
    const today = new Date().toISOString().slice(0,10);
    if(localStorage.getItem(key) !== today){
      await clearLocalAppCache();
      localStorage.setItem(key, today);
    }
  } catch(e){}
}

let seenNotifIds = null;
async function loadNotifications(){

  const { data } = await sb.from("notifications").select("*").eq("user_id", state.profile.id).order("created_at",{ascending:false}).limit(30);
  state.notifications = data || [];
  state.unreadCount = state.notifications.filter(n => !n.is_read).length;

  // Notification système simple : dès qu'une notif non lue apparaît pour la
  // première fois depuis l'ouverture de l'app, on affiche une vraie bannière
  // native (fonctionne tant que le site reste ouvert, même en arrière-plan).
  if(seenNotifIds === null){
    seenNotifIds = new Set(state.notifications.map(n => n.id)); // 1er chargement : rien à notifier rétroactivement
  } else {
    const fresh = state.notifications.filter(n => !n.is_read && !seenNotifIds.has(n.id));
    for(const n of fresh){
      seenNotifIds.add(n.id);
      if(typeof Notification !== "undefined" && Notification.permission === "granted"){
        let body = n.message || "";
        if(body.startsWith("PASS_REQ::")){
          try{
            const j = JSON.parse(body.slice(9));
            body = (j.user_name||"Client")+" · "+(j.pack_id||"")+(j.amount?" · "+j.amount+" FCFA":"");
          }catch(e){ body = "Demande de recharge Pass"; }
        }
        try{ new Notification(n.title, { body, icon: "/icon-192.png", tag: "pc-"+n.id }); } catch(e){}
      }
    }
    state.notifications.forEach(n => seenNotifIds.add(n.id));
  }
}

async function loadClientPressingOnly(pressingId){
  if(!pressingId) return;
  try{
    let pressing = null;
    const { data, error } = await sb.from("pressings").select("id,name,phone,whatsapp,address,invite_code").eq("id", pressingId).maybeSingle();
    if(!error && data) pressing = data;
    if(!pressing){
      // Repli via RPC
      try{
        const { data: r } = await sb.rpc("get_pressing_public", { p_id: pressingId });
        pressing = Array.isArray(r) ? r[0] : r;
      } catch(e){}
    }
    state.pressingsList = pressing ? [pressing] : [];
    state.selectedPressingId = pressingId;
    const [{ data: zones }, { data: services }, { data: allSlots }] = await Promise.all([
      sb.from("zones").select("*").eq("is_active", true).order("name"),
      sb.from("services").select("*").eq("pressing_id", pressingId).eq("is_active", true).order("name"),
      sb.from("time_slots").select("*").eq("pressing_id", pressingId).eq("is_active", true).order("start_time"),
    ]);
    const slots = (allSlots||[]).filter(s => (s.kind||'pickup') === 'pickup');
    const deliverySlots = (allSlots||[]).filter(s => s.kind === 'delivery');
    state.clientConfig = { pressing, zones: zones||[], services: services||[], slots, deliverySlots };
    resetBooking();
    // S'assurer que le client est bien dans le réseau du pressing
    try{ await enrollInNetwork(pressingId); }catch(e){}
    if(state.profile && !state.profile.home_pressing_id){
      try{
        await sb.from("profiles").update({ home_pressing_id: pressingId }).eq("id", state.profile.id);
        state.profile.home_pressing_id = pressingId;
      }catch(e){}
    }
    await loadClientCampaigns(pressingId);
    await loadFeaturedReviews(pressingId);
  } catch(e){ console.warn("loadClientPressingOnly:", e.message); }
}

  state.orders = data || [];

async function enrollInNetwork(pressingId){
  if(!pressingId || !state.profile?.id) return false;
  try{
    const { error } = await sb.from("pressing_customers").upsert(
      { pressing_id: pressingId, customer_id: state.profile.id, joined_at: new Date().toISOString() },
      { onConflict: "pressing_id,customer_id" }
    );
    if(error){ console.warn("enrollInNetwork:", error.message); return false; }
    return true;
  } catch(e){ console.warn("enrollInNetwork:", e.message); return false; }
}
async function loadPressingClients(){
  if(!state.myPressing?.id){ state.pressingClients = []; state.pressingClientsError = null; return; }
  try{
    // RPC SECURITY DEFINER si dispo (évite récursion RLS)
    try{
      const { data: rpcData, error: rpcErr } = await sb.rpc("get_pressing_clients", { p_pressing_id: state.myPressing.id });
      if(!rpcErr && rpcData){
        state.pressingClients = (rpcData||[]).map(r => ({
          customer_id: r.customer_id || r.id,
          joined_at: r.joined_at,
          profiles: { full_name: r.full_name, phone: r.phone, home_address: r.home_address, work_address: r.work_address }
        }));
        state.pressingClientsError = null;
        return;
      }
    } catch(e){}
    const { data: links, error } = await sb.from("pressing_customers")
      .select("customer_id, joined_at")
      .eq("pressing_id", state.myPressing.id)
      .order("joined_at", { ascending: false })
      .limit(100);
    if(error) throw error;
    const ids = (links || []).map(r => r.customer_id).filter(Boolean);
    let byId = {};
    if(ids.length){
      // Par paquets pour limiter la charge / RLS
      for(let i=0;i<ids.length;i+=20){
        const chunk = ids.slice(i,i+20);
        const { data: profs } = await sb.from("profiles").select("id, full_name, phone, home_address, work_address").in("id", chunk);
        (profs || []).forEach(pr => { byId[pr.id] = pr; });
      }
    }
    state.pressingClients = (links || []).map(r => ({
      customer_id: r.customer_id,
      joined_at: r.joined_at,
      profiles: byId[r.customer_id] || {}
    }));
    state.pressingClientsError = null;
  } catch(e){
    console.warn("loadPressingClients:", e.message);
    const fromOrders = [];
    const seen = new Set();
    for(const o of (state.pressingOrders || [])){
      if(!o.customer_id || seen.has(o.customer_id)) continue;
      seen.add(o.customer_id);
      fromOrders.push({
        customer_id: o.customer_id,
        joined_at: o.created_at,
        profiles: { full_name: o.customer?.full_name, phone: o.customer?.phone }
      });
    }
    state.pressingClients = fromOrders;
    const msg = e.message || String(e);
    state.pressingClientsError = /stack depth/i.test(msg)
      ? "Récursion RLS — exécutez FIX_RLS_PERFORMANCE.sql dans Supabase."
      : (fromOrders.length ? null : msg);
  }
}

async function confirmCampaignSlot(campaignId, slotId, mode, date){
  try{
    const prof = await ensureProfileRow();
    if(!prof?.id) throw new Error("Profil introuvable. Déconnecte-toi et reconnecte-toi.");
    state.profile = prof;
    if(state.selectedPressingId) await enrollInNetwork(state.selectedPressingId);
    if(!clientHasActivePass(state.profile)){
      alert("Plus de crédits Pass. Recharge ton Pass pour confirmer.");
      clientGo("pass");
      return;
    }
    const { data: order, error } = await sb.from("orders").insert({
      customer_id: prof.id,
      pressing_id: state.selectedPressingId,
      pickup_mode: mode || "domicile",
      pickup_date: date || todayISO(),
      notes: "Confirmation collecte groupée",
      estimated_amount: 0,
      order_status: "collecte_programmee"
    }).select().single();
    if(error) throw error;
    try{
      await sb.from("campaign_responses").upsert({
        campaign_id: campaignId,
        slot_id: slotId,
        customer_id: prof.id,
        order_id: order.id,
        status: "confirmed"
      }, { onConflict: "campaign_id,customer_id" });
    } catch(e){ console.warn("campaign_responses:", e.message); }
    try{ await deductPassCredit(); }catch(e){}
    state.confirmedCampaigns = state.confirmedCampaigns || {};
    state.confirmedCampaigns[campaignId] = slotId;
    await loadClientOrders();
    alert("Créneau confirmé. Le pressing a reçu ta demande.");
    render();
  } catch(e){ alert("Erreur : " + (e.message || e)); }
}

function setItemQty(svcId, delta){
  if(!state.booking || !state.booking.items) resetBooking();
  const cur = state.booking.items[svcId] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.booking.items[svcId]; else state.booking.items[svcId] = next;
  render();
}
function bookingStep(n){ state.booking.step = n; render(); }
async function bookingConfirm(){
  setState({ bookingSubmitting:true, bookingError:null });
  if(!state.booking || !state.booking.items) resetBooking();
  const b = state.booking; const cfg = state.clientConfig;
  try{
    // Garantir que le profil existe en base (évite FK orders_customer_id_fkey)
    const prof = await ensureProfileRow();
    if(!prof || !prof.id){
      throw new Error("Profil client introuvable en base. Déconnecte-toi, exécute PROFILE_FIX.sql, puis reconnecte-toi.");
    }
    state.profile = prof;
    const customerId = prof.id;
    if(state.selectedPressingId) await enrollInNetwork(state.selectedPressingId);

    // Vérification Pass Rechargement
    if(!clientHasActivePass(state.profile)){
      setState({ bookingSubmitting:false, bookingError:null, clientScreen:"pass", passRequestError:"Tu n'as plus de crédits. Recharge ton Pass pour réserver." });
      return;
    }
    let pickupAddressId = null;
    if(b.mode === "domicile"){
      const zone = (cfg.zones||[]).find(z => z.id === b.zoneId);
      try{
        const { data: addr, error: addrErr } = await sb.from("addresses").insert({
          customer_id: customerId, label:"Domicile", zone_id: b.zoneId || null, quartier: zone?.name, landmark:b.landmark, details:b.address, phone:state.profile.phone
        }).select().single();
        if(!addrErr && addr) pickupAddressId = addr.id;
      } catch(e){ console.warn("address:", e.message); }
    }
    const itemsTotal = Object.entries(b.items || {}).reduce((s,[svcId,qty]) => {
      const svc = (cfg.services||[]).find(x => x.id === svcId);
      return s + (svc ? svc.price*qty : 0);
    }, 0);
    const { data: order, error: orderErr } = await sb.from("orders").insert({
      customer_id: customerId, pressing_id: state.selectedPressingId, pickup_mode: b.mode, pickup_address_id: pickupAddressId,
      pickup_date: b.date || todayISO(), pickup_slot_id: b.slotId || null, delivery_slot_id: b.deliverySlotId || null, quantity_estimate: b.quantity,
      quantity_count: b.exactQuantity ? parseInt(b.exactQuantity,10) : null,
      estimated_amount: (itemsTotal || 3500)
    }).select().single();
    if(orderErr) throw orderErr;
    const itemRows = Object.entries(b.items).filter(([,q])=>q>0).map(([svcId,qty]) => {
      const svc = cfg.services.find(x => x.id === svcId);
      return { order_id: order.id, service_id: svcId, item_name: svc?.name, quantity: qty, unit_price: svc?.price||0, total_price: (svc?.price||0)*qty };
    });
    if(itemRows.length) await sb.from("order_items").insert(itemRows);
    // Notifier le pressing (DB + push native)
    try{
      const pressing = state.clientConfig?.pressing || state.pressingsList?.find(x => x.id === state.selectedPressingId);
      const ownerId = pressing?.owner_profile_id;
      if(ownerId){
        const title = "Nouvelle demande reçue";
        const message = "Commande "+(order.order_number||"")+" — collecte prévue le "+(order.pickup_date||"");
        await sb.from("notifications").insert({ user_id: ownerId, title, message, is_read:false });
        await sendNativePush([ownerId], title, message, "/");
      }
    } catch(e){ console.warn("notif pressing:", e.message); }
    // Décompte d'un crédit après succès de la réservation
    await deductPassCredit();
    // Lier le client au pressing (visible dans "Mes clients")
    if(state.selectedPressingId) await enrollInNetwork(state.selectedPressingId);
    // Si pas d'adresse domicile au profil, enregistrer celle de la collecte
    if(b.mode === "domicile" && b.address && !(state.profile.home_address||"").trim()){
      try{
        const { data: upd } = await sb.from("profiles").update({ home_address: b.address }).eq("id", state.profile.id).select("*").single();
        if(upd) state.profile = upd;
      } catch(e){}
    }
    await loadClientOrders();
    state.activeOrderId = order.id; state.bookingSubmitting = false;
    setState({ clientScreen: "track" });
  } catch(e){ setState({ bookingSubmitting:false, bookingError: e.message || "Une erreur est survenue." }); }
}

async function submitPassRechargeRequest(){
  const packs = getPassPacks();
  const packId = state.passSelectedPack;
  if(!packId || !packs[packId]){ setState({ passRequestError:"Choisis un forfait." }); return; }
  const pack = packs[packId];
  setState({ passRequestSubmitting:true, passRequestError:null, passRequestSuccess:null });
  try{
    const note = (document.getElementById("passNoteInput")?.value || state.passRequestNote || "").trim();
    const payload = {
      user_id: state.profile.id,
      pack_id: pack.id,
      amount: pack.price,
      credits: pack.credits,
      days: pack.days,
      note: note || null,
      status: "pending",
      user_name: state.profile.full_name,
      user_phone: state.profile.phone
    };
    // 1) Table dédiée
    let tableOk = false;
    try{
      const { error } = await sb.from("pass_recharge_requests").insert(payload);
      if(error) console.warn("pass_recharge_requests:", error.message);
      else tableOk = true;
    } catch(e){ console.warn("pass_recharge_requests fetch:", e.message); }

    // 2) Toujours notifier les admins (file de secours + alerte)
    const { data: admins } = await sb.from("profiles").select("id").eq("role","admin").limit(20);
    if(admins && admins.length){
      const structured = "PASS_REQ::" + JSON.stringify({
        user_id: payload.user_id,
        pack_id: payload.pack_id,
        amount: payload.amount,
        credits: payload.credits,
        days: payload.days,
        note: payload.note,
        user_name: payload.user_name,
        user_phone: payload.user_phone,
        at: new Date().toISOString()
      });
      await sb.from("notifications").insert(admins.map(a => ({
        user_id: a.id,
        title: "Demande de recharge Pass",
        message: structured,
        is_read: false
      })));
      await sendNativePush(admins.map(a => a.id), "Demande de recharge Pass",
        (state.profile.full_name||"Client")+" · "+pack.label+" · "+fcfa(pack.price), "/");
    }
    if(!tableOk && (!admins || !admins.length)){
      setState({ passRequestSubmitting:false, passRequestError: "Impossible d'envoyer la demande (table ou admin introuvable). Contacte le support." });
      return;
    }
    setState({
      passRequestSubmitting:false,
      passRequestSuccess: "Demande envoyée ! L'admin validera ta recharge dès réception du paiement.",
      passSelectedPack: null,
      passRequestNote: ""
    });
  } catch(e){
    setState({ passRequestSubmitting:false, passRequestError: e.message || "Erreur lors de l'envoi." });
  }
}

async function ensurePressingForOwner(profile){
  // Ne crée QUE s'il n'existe encore AUCUNE fiche pour ce propriétaire.
  // Évite les doublons (listes "PRESSING FIRST" x4 côté client).
  const { data: existing } = await sb.from("pressings")
    .select("*")
    .eq("owner_profile_id", profile.id)
    .order("created_at", { ascending: true })
    .limit(1)
    .maybeSingle();
  if(existing){
    // S'assurer qu'un abonnement existe
    const { data: sub } = await sb.from("subscriptions").select("id").eq("pressing_id", existing.id).maybeSingle();
    if(!sub){
      const trialEnd = new Date(); trialEnd.setDate(trialEnd.getDate() + 30);
      await sb.from("subscriptions").insert({
        pressing_id: existing.id, plan: "trial",
        trial_end: trialEnd.toISOString().slice(0,10), manual_status: "ok"
      });
    }
    return existing;
  }
  const name = (profile.full_name || "Mon Pressing").trim() || "Mon Pressing";
  const phone = (profile.phone || "").trim() || null;
  const { data: pressing, error } = await sb.from("pressings").insert({
    name, phone, owner_profile_id: profile.id, status: "active", address: null, invite_code: generateInviteCode()
  }).select("*").single();
  if(error || !pressing){
    console.error("Création pressing échouée:", error);
    return null;
  }
  const trialEnd = new Date(); trialEnd.setDate(trialEnd.getDate() + 30);
  await sb.from("subscriptions").insert({
    pressing_id: pressing.id, plan: "trial",
    trial_end: trialEnd.toISOString().slice(0,10), manual_status: "ok"
  });
  return pressing;
}
async function loadMyPressing(){
  // Prend le plus ancien pour stabiliser en cas de doublons historiques
  const { data } = await sb.from("pressings").select("*").eq("owner_profile_id", state.profile.id).order("created_at",{ascending:true}).limit(1).maybeSingle();
  state.myPressing = data;
}
async function manualCreateMyPressing(){
  if(!state.profile) return;
  await ensurePressingForOwner(state.profile);
  await loadMyPressing();
  if(state.myPressing){
    await Promise.all([loadPressingOrders(), loadPressingAgents(), loadMySubscription(), loadPressingClients()]);
    attachPressingRealtime();
  }
  render();
}
async function loadPressingOrders(){
  if(!state.myPressing?.id){ state.pressingOrders = []; return; }
  const { data, error } = await sb.from("orders").select("*, order_items(*)").eq("pressing_id", state.myPressing.id).order("created_at",{ascending:false});
  if(error){
    console.error("loadPressingOrders:", error.message);
    // Repli : toutes les commandes visibles puis filtre
    const { data: all } = await sb.from("orders").select("*, order_items(*)").order("created_at",{ascending:false}).limit(100);
    const ordersFallback = (all||[]).filter(o => o.pressing_id === state.myPressing.id);
    state.pressingOrders = ordersFallback;
    if(!ordersFallback.length) state.pressingOrdersError = error.message;
    else state.pressingOrdersError = null;
  }
  const orders = (!error && data) ? data : (state.pressingOrders || []);
  if(!error) state.pressingOrdersError = null;
  const custIds = [...new Set(orders.map(o => o.customer_id).filter(Boolean))];
  if(custIds.length){
    const { data: profs } = await sb.from("profiles").select("id,full_name,phone,home_address,work_address").in("id", custIds);
    const byId = {}; (profs||[]).forEach(p => byId[p.id] = p);
    orders.forEach(o => { o.customer = byId[o.customer_id] || null; });
  }
  const slotIds = [...new Set([...orders.map(o=>o.pickup_slot_id), ...orders.map(o=>o.delivery_slot_id)].filter(Boolean))];
  if(slotIds.length){
    const { data: slots } = await sb.from("time_slots").select("id,label,zone_label,landmark,start_time,end_time").in("id", slotIds);
    const byId = {}; (slots||[]).forEach(s => byId[s.id] = s);
    orders.forEach(o => { o.pickupSlot = byId[o.pickup_slot_id] || null; o.deliverySlot = byId[o.delivery_slot_id] || null; });
  }
  state.pressingOrders = orders;
}
async function loadPressingAgents(){
  if(!state.myPressing?.id){ state.pressingAgents = []; return; }
  try{
    const { data, error } = await sb.from("agents").select("id, phone, status, pressing_id").eq("pressing_id", state.myPressing.id).eq("status","active");
    if(error) throw error;
    const ids = (data||[]).map(a => a.id);
    let byId = {};
    if(ids.length){
      const { data: profs } = await sb.from("profiles").select("id, full_name, phone").in("id", ids);
      (profs||[]).forEach(pr => { byId[pr.id] = pr; });
    }
    state.pressingAgents = (data||[]).map(a => ({ ...a, profiles: byId[a.id] || { full_name: "Agent", phone: a.phone } }));
  } catch(e){
    console.warn("loadPressingAgents:", e.message);
    state.pressingAgents = [];
  }
}
async function pressingAddAgent(){
  const name = (document.getElementById("newAgentName")?.value || "").trim();
  const phone = (document.getElementById("newAgentPhone")?.value || "").trim();
  const email = (document.getElementById("newAgentEmail")?.value || "").trim().toLowerCase();
  const password = (document.getElementById("newAgentPassword")?.value || "").trim();
  if(!name || !phone || !email || !password){ alert("Nom, téléphone, e-mail et mot de passe sont requis."); return; }
  if(password.length < 6){ alert("Mot de passe : 6 caractères minimum."); return; }
  if(!state.myPressing?.id) return;
  // Client séparé : ne pas remplacer la session du pressing
  const tempSb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
  try{
    const { data: created, error } = await tempSb.auth.signUp({
      email, password,
      options: { data: { full_name: name, phone, role: "agent", pressing_id: state.myPressing.id } }
    });
    if(error){
      if(/already|registered|exists/i.test(error.message||"")){
        alert("Cet e-mail est déjà utilisé. Choisissez un autre e-mail pour le nouvel agent, ou demandez-lui de se connecter puis contactez l'admin pour le rattacher.");
        return;
      }
      throw error;
    }
    const uid = created?.user?.id;
    if(!uid){
      alert("Compte créé. L'agent doit confirmer son e-mail puis se connecter. Identifiants :\n"+email+"\n"+password);
      return;
    }
    // Écritures avec la session pressing (owner)
    try{
      await sb.from("profiles").upsert({ id: uid, full_name: name, phone, role: "agent" });
    } catch(e){ console.warn("profile agent:", e.message); }
    const { error: e2 } = await sb.from("agents").upsert({
      id: uid, pressing_id: state.myPressing.id, phone, status: "active"
    });
    if(e2) throw e2;
    await loadPressingAgents();
    render();
    alert("Agent ajouté.\nE-mail : "+email+"\nMot de passe : "+password+"\n\nCommuniquez-les à l'agent de façon sécurisée.");
  } catch(e){
    const msg = e.message || String(e);
    if(/stack depth/i.test(msg)){
      alert("Erreur base (RLS). Exécutez FIX_RLS_PERFORMANCE.sql dans Supabase, puis réessayez avec un e-mail jamais utilisé.");
    } else {
      alert("Impossible d'ajouter l'agent : "+msg);
    }
  }
}

function filterPressingOrders(orders){
  const q = (state.pressingOrderSearch || "").trim().toLowerCase();
  if(!q) return orders || [];
  const digits = q.replace(/\D/g, "");
  return (orders || []).filter(o => {
    const num = String(o.order_number || "").toLowerCase();
    const name = String(o.customer?.full_name || "").toLowerCase();
    const phone = String(o.customer?.phone || "").toLowerCase();
    const phoneDigits = phone.replace(/\D/g, "");
    if(num.includes(q)) return true;
    if(name.includes(q)) return true;
    if(phone.includes(q)) return true;
    if(digits && phoneDigits.includes(digits)) return true;
    if(String(o.id || "").toLowerCase().startsWith(q)) return true;
    return false;
  });
}

  await sb.from("pickup_requests").insert({ order_id: orderId, agent_id: agentId, scheduled_at: new Date().toISOString() });
  await sb.from("orders").update({ order_status: "collecte_programmee" }).eq("id", orderId);
  const order = state.pressingOrders.find(o => o.id === orderId);
  if(order?.customer_id){
    await notifyUser(order.customer_id, "Collecte programmée", "Votre commande "+(order.order_number||"")+" a une collecte programmée.", "/");
  }
  await loadPressingOrders(); render();
}
async function pressingAdvance(id){
  const order = state.pressingOrders.find(o => o.id === id);
  const status = nextStatus(order.order_status);
  await sb.from("orders").update({ order_status: status, updated_at: new Date().toISOString() }).eq("id", id);
  await sb.from("order_status_history").insert({ order_id:id, status, changed_by: state.profile.id });
  if(order?.customer_id){
    const label = (STATUS_LABELS && STATUS_LABELS[status]) || status;
    await notifyUser(order.customer_id, "Commande mise à jour", (order.order_number||"")+" — "+label, "/");
  }
  await loadPressingOrders(); render();
}

async function publishCampaign(){
  const pid = myPressingId();
  if(!pid){ alert("Pressing introuvable."); return; }
  if(state._publishingCampaign) return;
  const title = (document.getElementById("campTitle")?.value || state.draftCampaign?.title || "").trim();
  const message = (document.getElementById("campMessage")?.value || state.draftCampaign?.message || "").trim();
  let campaign_date = (document.getElementById("campDate")?.value || state.draftCampaign?.campaign_date || "").trim();
  // Normaliser date FR jj/mm/aaaa → aaaa-mm-jj
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(campaign_date)){
    const [dd,mm,yy] = campaign_date.split("/");
    campaign_date = yy + "-" + mm.padStart(2,"0") + "-" + dd.padStart(2,"0");
  }
  const mode = state.draftCampaign?.mode || "domicile";
  if(!title || !campaign_date){ alert("Titre et date requis."); return; }
  const slots = [];
  const n = Math.max((state.draftCampaign?.slots || []).length, 1);
  for(let i=0;i<n;i++){
    const zone = (document.getElementById("campZone"+i)?.value || state.draftCampaign?.slots?.[i]?.zone_label || "").trim();
    const start = (document.getElementById("campStart"+i)?.value || state.draftCampaign?.slots?.[i]?.start_time || "07:00").trim();
    const end = (document.getElementById("campEnd"+i)?.value || state.draftCampaign?.slots?.[i]?.end_time || "09:00").trim();
    if(zone) slots.push({ zone_label: zone, start_time: start.length===5?start+":00":start, end_time: end.length===5?end+":00":end });
  }
  state._publishingCampaign = true;
  try{
    const payload = {
      pressing_id: pid,
      created_by: state.profile.id,
      title, message, campaign_date, mode, status: "published"
    };
    const { data: camp, error } = await sb.from("campaigns").insert(payload).select("id").single();
    if(error) throw error;
    if(slots.length && camp?.id){
      const { error: e2 } = await sb.from("campaign_slots").insert(
        slots.map(s => ({ campaign_id: camp.id, zone_label: s.zone_label, start_time: s.start_time, end_time: s.end_time }))
      );
      if(e2) throw e2;
    }
    await loadPressingCampaigns();
    state._publishingCampaign = false;
    state.campaignsView = "list";
    render();
    alert("Campagne publiée.");
  } catch(e){
    state._publishingCampaign = false;
    const msg = e.message || String(e);
    if(/permission|policy|RLS|row-level/i.test(msg)){
      alert("Droit refusé (RLS). Exécute CAMPAIGNS_SQL.sql dans Supabase, puis réessaie.\n"+msg);
    } else if(/timeout|Failed to fetch|network/i.test(msg)){
      alert("Réseau lent. Réessaie dans quelques secondes.");
    } else {
      alert("Erreur publication : " + msg);
    }
  }
}

async function loadMyAgent(){ const { data } = await sb.from("agents").select("*, pressings(name)").eq("id", state.profile.id).maybeSingle(); state.myAgent = data; }
async function loadMissions(){
  const [pu, de] = await Promise.all([
    sb.from("pickup_requests").select("*, orders(*)").eq("agent_id", state.profile.id),
    sb.from("delivery_requests").select("*, orders(*)").eq("agent_id", state.profile.id),
  ]);
  const pickups = (pu.data||[]).filter(r=>r.orders).map(r => ({ ...r.orders, missionType:"collecte" }));
  const deliveries = (de.data||[]).filter(r=>r.orders).map(r => ({ ...r.orders, missionType:"livraison" }));
  const missions = [...pickups, ...deliveries].filter(o => !["termine","annule"].includes(o.order_status));
  const custIds = [...new Set(missions.map(m => m.customer_id).filter(Boolean))];
  if(custIds.length){
    const { data: profs } = await sb.from("profiles").select("id,full_name,phone,home_address,work_address").in("id", custIds);
    const byId = {}; (profs||[]).forEach(p => byId[p.id] = p);
    missions.forEach(m => { m.customer = byId[m.customer_id] || null; });
  }
  state.missions = missions;
}

async function submitAdminCreatePressing(){
  const name = (document.getElementById("adminPressName")?.value || "").trim();
  const phone = (document.getElementById("adminPressPhone")?.value || "").trim();
  const ownerHint = (document.getElementById("adminPressOwnerEmail")?.value || "").trim();
  const address = (document.getElementById("adminPressAddress")?.value || "").trim() || null;
  if(!name){ state.adminCreateError = "Le nom du pressing est obligatoire."; state.adminCreateSuccess = null; render(); return; }

  // 1) Chercher un profil propriétaire (par téléphone ou nom)
  let ownerId = null;
  const { data: prows } = await sb.from("profiles").select("id,full_name,phone,role").eq("role","pressing").limit(100);
  const phoneNorm = normalizePhone(phone);
  const hintNorm = normalizePhone(ownerHint);
  if(prows && prows.length){
    let match = null;
    if(phoneNorm) match = prows.find(p => normalizePhone(p.phone) === phoneNorm);
    if(!match && hintNorm) match = prows.find(p => normalizePhone(p.phone) === hintNorm);
    if(!match && ownerHint) match = prows.find(p => (p.full_name||"").toLowerCase().includes(ownerHint.toLowerCase()));
    if(match) ownerId = match.id;
  }

  // 2) Chercher un pressing existant (même nom OU même téléphone) pour ÉVITER les doublons
  let existing = null;
  const { data: byName } = await sb.from("pressings").select("*").ilike("name", name).limit(5);
  if(byName && byName.length){
    // Priorité : même propriétaire, sinon même téléphone, sinon le plus ancien
    existing = byName.find(p => ownerId && p.owner_profile_id === ownerId)
      || (phoneNorm ? byName.find(p => normalizePhone(p.phone) === phoneNorm) : null)
      || byName[0];
  }
  if(!existing && phoneNorm){
    const { data: byPhone } = await sb.from("pressings").select("*").eq("phone", phone).limit(1).maybeSingle();
    if(byPhone) existing = byPhone;
    // Aussi essayer sans espaces
    if(!existing){
      const { data: allPh } = await sb.from("pressings").select("*").not("phone","is",null).limit(50);
      existing = (allPh||[]).find(p => normalizePhone(p.phone) === phoneNorm) || null;
    }
  }

  let pressing = existing;
  let actionMsg = "";

  if(existing){
    // Mise à jour du pressing existant plutôt que création de doublon
    const updates = { status: "active" };
    if(phone) updates.phone = phone;
    if(address) updates.address = address;
    if(ownerId && !existing.owner_profile_id) updates.owner_profile_id = ownerId;
    await sb.from("pressings").update(updates).eq("id", existing.id);
    pressing = { ...existing, ...updates };
    actionMsg = `Pressing « ${name} » déjà existant → mis à jour`;
  } else {
    const { data: created, error } = await sb.from("pressings").insert({
      name, phone: phone || null, address, owner_profile_id: ownerId, status: "active"
    }).select("*").single();
    if(error){
      state.adminCreateError = "Erreur création : " + (error.message || "inconnue");
      state.adminCreateSuccess = null;
      render(); return;
    }
    pressing = created;
    actionMsg = `Nouveau pressing « ${name} » créé`;
  }

  // 3) Toujours s'assurer d'un abonnement essai / actif
  await ensureTrialSubscription(pressing.id);

  state.adminCreateOpen = false;
  state.adminCreateError = null;
  state.adminCreateSuccess = actionMsg + " + essai 30 jours activé" + (ownerId ? " · propriétaire lié" : " · (aucun propriétaire trouvé, liez-le ensuite)");
  await loadAdminPressings();
  render();
  // Efface le message de succès après quelques secondes
  setTimeout(() => { if(state.adminCreateSuccess){ state.adminCreateSuccess = null; render(); } }, 6000);
}

// ---- Admin : validation des recharges Pass ----
async function loadAdminPassRequests(){
  let rows = [];
  // 1) RPC sécurisée (contourne RLS si migrée)
  try{
    const { data, error } = await sb.rpc("admin_list_pass_requests");
    if(!error && data) rows = data;
    else if(error) console.warn("admin_list_pass_requests:", error.message);
  } catch(e){ console.warn("rpc pass requests:", e.message); }
  // 2) Table directe
  if(!rows.length){
    try{
      const { data, error } = await sb.from("pass_recharge_requests").select("*").order("created_at",{ascending:false}).limit(50);
      if(error) console.warn("pass_recharge_requests:", error.message);
      else rows = data || [];
    } catch(e){ console.warn("pass_recharge_requests fetch:", e.message); }
  }

  // 2) File de secours : notifications admin structurées PASS_REQ::
  try{
    const { data: notifs } = await sb.from("notifications")
      .select("*")
      .eq("user_id", state.profile.id)
      .eq("title", "Demande de recharge Pass")
      .order("created_at",{ascending:false})
      .limit(40);
    const seenKeys = new Set(rows.map(r => `${r.user_id}|${r.pack_id}|${r.amount}|${(r.created_at||"").slice(0,16)}`));
    for(const n of (notifs||[])){
      if(!n.message || !n.message.startsWith("PASS_REQ::")) continue;
      try{
        const j = JSON.parse(n.message.slice(9));
        const key = `${j.user_id}|${j.pack_id}|${j.amount}|${(j.at||n.created_at||"").slice(0,16)}`;
        // Éviter doublon avec la table
        if(rows.some(r => r.user_id === j.user_id && r.pack_id === j.pack_id && r.status === "pending" && Math.abs(new Date(r.created_at) - new Date(j.at||n.created_at)) < 120000)) continue;
        if(n.is_read) {
          // déjà traité via notif
          continue;
        }
        rows.push({
          id: "notif:" + n.id,
          _notif_id: n.id,
          user_id: j.user_id,
          pack_id: j.pack_id,
          amount: j.amount,
          credits: j.credits,
          days: j.days,
          note: j.note,
          status: "pending",
          user_name: j.user_name,
          user_phone: j.user_phone,
          created_at: j.at || n.created_at,
          source: "notification"
        });
      } catch(e){}
    }
  } catch(e){ console.warn("notif fallback:", e.message); }

  // Trier pending d'abord
  rows.sort((a,b) => {
    if(a.status === "pending" && b.status !== "pending") return -1;
    if(b.status === "pending" && a.status !== "pending") return 1;
    return new Date(b.created_at||0) - new Date(a.created_at||0);
  });
  state.adminPassRequests = rows;
}

async function creditClientPass(userId, credits, days, packLabel){
  const { data: prof, error } = await sb.from("profiles").select("*").eq("id", userId).single();
  if(error || !prof) throw new Error("Profil client introuvable.");
  let updates = {};
  if(days){
    const base = (prof.pass_type === "unlimited" && prof.pass_expiration && new Date(prof.pass_expiration) > new Date())
      ? new Date(prof.pass_expiration) : new Date();
    base.setDate(base.getDate() + Number(days));
    updates = { pass_type: "unlimited", pass_expiration: base.toISOString(), pass_credits: prof.pass_credits || 0 };
  } else {
    updates = { pass_type: "pack", pass_credits: (prof.pass_credits || 0) + Number(credits||0), pass_expiration: null };
  }
  const { error: upErr } = await sb.from("profiles").update(updates).eq("id", userId);
  if(upErr) throw upErr;
  await sb.from("notifications").insert({
    user_id: userId,
    title: "Pass rechargé ✓",
    message: days
      ? `Ton Pass Illimité (${days} jours) est actif.`
      : `+${credits} réservation(s) ajoutée(s) à ton Pass.`,
    is_read: false
  });
}

  let clients = [];
  // RPC admin (recommandé après migration SQL)

async function adminDeleteUser(userId){
  if(!userId) return;
  const u = (state.adminUsers || []).find(x => x.id === userId);
  if(u && u.role === "admin"){ alert("Impossible de supprimer un compte admin."); return; }
  if(!confirm("Supprimer ce compte et ses données liées ?\\n"+(u ? (u.full_name||"")+" · "+(u.role||"") : userId))) return;
  try{
    // Nettoyage données liées (meilleur effort)
    await sb.from("notifications").delete().eq("user_id", userId);
    await sb.from("push_subscriptions").delete().eq("user_id", userId);
    try{ await sb.from("pass_recharge_requests").delete().eq("user_id", userId); }catch(e){}
    try{ await sb.from("pressing_customers").delete().eq("customer_id", userId); }catch(e){}
    try{ await sb.from("orders").delete().eq("customer_id", userId); }catch(e){}
    const { error } = await sb.from("profiles").delete().eq("id", userId);
    if(error) throw error;
    // Auth user : via Edge Function si déployée
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session){
        await fetch((typeof SUPABASE_URL!=="undefined"?SUPABASE_URL:"")+"/functions/v1/admin-delete-user", {
          method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token },
          body: JSON.stringify({ user_id: userId })
        });
      }
    } catch(e){ console.warn("auth delete:", e.message); }
    await loadAdminUsers();
    render();
    alert("Compte supprimé.");
  } catch(e){
    alert("Suppression impossible : "+(e.message||e));
  }
}

async function adminWipeNonAdmins(){
  if(!confirm("ATTENTION : supprimer TOUS les comptes sauf les admins ?\\nCette action est irréversible.")) return;
  if(!confirm("Confirme une seconde fois la remise à zéro des comptes test.")) return;
  const list = (state.adminUsers || []).filter(u => u.role !== "admin");
  let ok = 0, fail = 0;
  for(const u of list){
    try{
      await sb.from("notifications").delete().eq("user_id", u.id);
      await sb.from("push_subscriptions").delete().eq("user_id", u.id);
      try{ await sb.from("pass_recharge_requests").delete().eq("user_id", u.id); }catch(e){}
      try{ await sb.from("pressing_customers").delete().eq("customer_id", u.id); }catch(e){}
      try{ await sb.from("orders").delete().eq("customer_id", u.id); }catch(e){}
      const { error } = await sb.from("profiles").delete().eq("id", u.id);
      if(error) throw error;
      try{
        const { data: { session } } = await sb.auth.getSession();
        if(session){
          await fetch((typeof SUPABASE_URL!=="undefined"?SUPABASE_URL:"")+"/functions/v1/admin-delete-user", {
            method:"POST",
            headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token },
            body: JSON.stringify({ user_id: u.id })
          });
        }
      } catch(e){}
      ok++;
    } catch(e){ fail++; console.warn(e); }
  }
  await loadAdminUsers();
  render();
  alert("Terminé : "+ok+" supprimé(s)"+(fail ? ", "+fail+" échec(s)" : "")+".");
}

async function adminSendMessage(){
  const title = (document.getElementById("adminMsgTitle")?.value || "").trim();
  const body = (document.getElementById("adminMsgBody")?.value || "").trim();
  const target = state.adminMsgTarget || "all";
  if(!title || !body){ alert("Titre et message requis."); return; }
  let users = state.adminUsers || [];
  if(!users.length){ await loadAdminUsers(); users = state.adminUsers || []; }
  let recipients = [];
  if(target === "all") recipients = users.filter(u => u.role !== "admin");
  else if(target === "clients") recipients = users.filter(u => u.role === "client");
  else if(target === "pressings") recipients = users.filter(u => u.role === "pressing");
  else if(target === "agents") recipients = users.filter(u => u.role === "agent");
  else if(target === "one"){
    const id = document.getElementById("adminMsgUserId")?.value;
    recipients = users.filter(u => u.id === id);
  }
  if(!recipients.length){ alert("Aucun destinataire."); return; }
  if(!confirm("Envoyer à "+recipients.length+" utilisateur(s) ?")) return;
  state.adminMsgSending = true; render();
  try{
    const rows = recipients.map(u => ({ user_id: u.id, title, message: body, is_read: false }));
    // insert par lots de 50
    for(let i=0;i<rows.length;i+=50){
      const { error } = await sb.from("notifications").insert(rows.slice(i,i+50));
      if(error) throw error;
    }
    await sendNativePush(recipients.map(u => u.id), title, body, "/");
    state.adminMsgTitle = "";
    state.adminMsgBody = "";
    state.adminMsgInfo = "✅ Message envoyé à "+recipients.length+" utilisateur(s).";
  } catch(e){
    state.adminMsgInfo = null;
    alert("Envoi impossible : "+(e.message||e));
  }
  state.adminMsgSending = false;
  render();
}

async function adminRunCleanup(kind){
  const days = Math.max(1, Math.min(365, parseInt(document.getElementById("adminCleanupDays")?.value || state.adminCleanupDays || 30, 10)));
  state.adminCleanupDays = days;
  const before = daysAgoISO(days);
  if(!confirm("Confirmer la purge (« "+kind+" ») des éléments de plus de "+days+" jours ?")) return;
  state.adminCleanupBusy = true;
  state.adminCleanupInfo = null;
  render();
  const notes = [];
  try{
    if(kind === "notifications" || kind === "all"){
      const { error, count } = await sb.from("notifications").delete({ count:"exact" }).lt("created_at", before);
      if(error) throw error;
      notes.push("Notifications : OK");
    }
    if(kind === "orders_closed" || kind === "all"){
      const { error } = await sb.from("orders").delete().in("order_status", CLOSED_ORDER_STATUSES).lt("created_at", before);
      if(error) throw error;
      notes.push("Commandes clôturées : OK");
    }
    if(kind === "pass_requests" || kind === "all"){
      try{
        const { error } = await sb.from("pass_recharge_requests").delete().in("status", ["approved","rejected","done","refused"]).lt("created_at", before);
        if(error) throw error;
        notes.push("Demandes Pass traitées : OK");
      } catch(e){
        notes.push("Demandes Pass : "+(e.message||"ignoré"));
      }
    }
    state.adminCleanupInfo = "✅ "+notes.join(" · ")+" (>"+days+" j)";
  } catch(e){
    state.adminCleanupInfo = null;
    alert("Nettoyage impossible : "+(e.message||e));
  }
  state.adminCleanupBusy = false;
  render();
}

async function submitAdminPassPrices(){
  const p5p = Number(document.getElementById("cfg_p5_price")?.value);

  const p10p = Number(document.getElementById("cfg_p10_price")?.value);

  const unlp = Number(document.getElementById("cfg_unl_price")?.value);
  const unld = Number(document.getElementById("cfg_unl_days")?.value);
  if([p5p,p5c,p10p,p10c,unlp,unld].some(n => isNaN(n) || n < 0)){
    setState({ adminPassPriceMsg: "Valeurs invalides — vérifie les champs." });
    return;
  }
  if(p5c < 1 || p10c < 1 || unld < 1){
    setState({ adminPassPriceMsg: "Le nombre de réservations / jours doit être ≥ 1." });
    return;

  try{
    const packs = getPassPacks();
    const config = {
      pack_5:  { price:p5p, credits:p5c, days:null, label:`Pass ${p5c} réservations`, desc: packs.pack_5.desc },

      unlimited: { price:unlp, credits:null, days:unld, label:`Pass Illimité ${unld} jours`, desc: packs.unlimited.desc },
    };
    await savePassPacksConfig(config);
    setState({
      adminPassPricesEdit: false,
      adminPassPriceMsg: `✅ Forfaits mis à jour et appliqués`
    });
    setTimeout(() => { if(state.adminPassPriceMsg){ state.adminPassPriceMsg = null; render(); } }, 4000);
  } catch(e){
    setState({ adminPassPriceMsg: "Erreur : " + (e.message || "impossible d'enregistrer. Vérifie la table platform_settings.") });
  }
}

// Clé publique VAPID (à apparier avec VAPID_PRIVATE_KEY côté Edge Function)
const VAPID_PUBLIC_KEY = "BC1OHhfJz4lfJ2OXzNrCsGzwbXi51pdHKcmccRLIiRgujgPteHEwyUJ_1dcdMBqF4wMSR7Ztn8pEwc1XxO-34zQ";

function registerServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("/sw.js", { scope: "/" })
    .then(reg => { state._swReg = reg; if(state.profile) ensurePushSubscription(); })
    .catch(e => console.warn("SW:", e.message));
}

function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function ensurePushSubscription(){
  // Automatique : lie l'abonnement push au compte connecté (plus besoin de coller l'UUID)
  const result = { ok:false, browserOk:false, dbOk:false, error:null };
  try{
    if(!("Notification" in window) || !("PushManager" in window)){
      result.error = "Navigateur incompatible.";
      return result;
    }
    if(!state.profile){
      result.error = "Profil non chargé.";
      return result;
    }
    if(Notification.permission === "denied"){
      result.error = "Permission refusée.";
      return result;
    }
    if(Notification.permission !== "granted"){
      result.error = "Permission non accordée.";
      return result;
    }
    const reg = state._swReg || await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    result.browserOk = true;
    const j = sub.toJSON();
    if(!j.keys || !j.keys.p256dh || !j.keys.auth){
      result.error = "Clés push invalides.";
      return result;
    }
    const uid = state.profile.id;
    const row = {
      user_id: uid,
      endpoint: j.endpoint,
      p256dh: j.keys.p256dh,
      auth: j.keys.auth,
      user_agent: (navigator.userAgent || "").slice(0, 180)
    };

    // 1) Upsert par endpoint (met à jour user_id si l'endpoint existait pour un autre compte)
    let error = null;
    ({ error } = await sb.from("push_subscriptions").upsert(row, { onConflict: "endpoint" }));

    // 2) Si échec : update forcé sur cet endpoint
    if(error){
      const upd = await sb.from("push_subscriptions").update({
        user_id: uid,
        p256dh: row.p256dh,
        auth: row.auth,
        user_agent: row.user_agent
      }).eq("endpoint", row.endpoint);
      error = upd.error;
    }

    // 3) Si encore échec : insert simple
    if(error){
      const ins = await sb.from("push_subscriptions").insert(row);
      error = ins.error;
    }

    // 4) Dernier recours : supprimer l'ancienne ligne endpoint puis réinsérer
    if(error){
      await sb.from("push_subscriptions").delete().eq("endpoint", row.endpoint);
      const ins2 = await sb.from("push_subscriptions").insert(row);
      error = ins2.error;
    }

    if(error){
      result.error = error.message || String(error);
      result.dbOk = false;
      // Notifs locales OK quand même
      state.pushEnabled = true;
      try{ localStorage.setItem("pc_push_ok", "1"); }catch(e){}
      return result;
    }

    result.dbOk = true;
    result.ok = true;
    state.pushEnabled = true;
    try{ localStorage.setItem("pc_push_ok", "1"); }catch(e){}
    return result;
  } catch(e){
    result.error = e.message || String(e);
    return result;
  }
}

async function enablePushFromUI(){
  try{
    if(!("Notification" in window)){
      alert("Les notifications ne sont pas disponibles sur cet appareil.");
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){
      alert("Permission refusée. Vous pourrez réessayer plus tard dans les réglages du navigateur.");
      state.pushBannerDismissed = true;
      render();
      return;
    }
    const res = await ensurePushSubscription();
    if(res.browserOk){
      try{
        new Notification("Pressing Connecté", {
          body: "Notifications activées. Vous serez alerté des nouvelles commandes et messages.",
          icon: "/icon-192.png"
        });
      } catch(e){}
      state.pushBannerDismissed = true;
      state.pushEnabled = true;
      render();
      // Détail technique uniquement dans la console (pas à l'écran utilisateur)
      if(!res.dbOk){
        console.warn("[push] enregistrement serveur:", res.error || "échec");
      }
    } else {
      console.warn("[push] activation:", res.error || "échec");
      alert("Impossible d'activer les notifications pour le moment. Réessayez plus tard.");
    }
  } catch(e){
    console.warn("[push]", e);
    alert("Impossible d'activer les notifications pour le moment. Réessayez plus tard.");
  }
}

function shouldShowPushBanner(){
  if(state.pushBannerDismissed || state.pushEnabled) return false;
  if(typeof Notification === "undefined") return false;
  if(Notification.permission === "granted") return false;
  if(Notification.permission === "denied") return false;
  try{ if(localStorage.getItem("pc_push_dismiss") === "1") return false; }catch(e){}
  return state.view === "app" && !!state.profile;
}

/** Envoie une push native via Edge Function (si déployée). Échec silencieux si absente. */
async function sendNativePush(userIds, title, body, url){
  if(!userIds || !userIds.length) return;
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(!session) return;
    const base = (typeof SUPABASE_URL !== "undefined" ? SUPABASE_URL : (sb.supabaseUrl || "")).replace(/\/$/, "");
    await fetch(base + "/functions/v1/send-push", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token,
        "apikey": sb.supabaseKey || ""
      },
      body: JSON.stringify({ user_ids: userIds, title, body: body || "", url: url || "/" })
    });
  } catch(e){
    console.warn("sendNativePush:", e.message);
  }
}

async function notifyUser(userId, title, message, url){

      title,
      message: message || "",
      is_read: false
    });
  } catch(e){ console.warn("notify insert:", e.message); }
  await sendNativePush([userId], title, message, url);
}

  if(role === "client"){
    if(state.clientScreen === "book" && state.booking && state.booking.step > 0){ state.booking.step--; render(); return; }
    if(state.clientScreen !== "home" && state.clientScreen !== "choosePressing"){ state.clientScreen = "home"; render(); return; }
    if(state.clientScreen === "home"){ state.clientScreen = "choosePressing"; render(); return; }
  }
  if(role === "pressing"){
    if(state.pressingConfigView !== "none"){ state.pressingConfigView = "none"; render(); return; }
    if(state.campaignsView === "new"){ state.campaignsView = "list"; render(); return; }
    if(state.campaignsView === "list"){ state.campaignsView = "none"; render(); return; }
    if(state.pressingSelectedOrderId){ state.pressingSelectedOrderId = null; render(); return; }
  }
  if(role === "agent"){
    if(state.campaignsView === "new"){ state.campaignsView = "list"; render(); return; }
    if(state.campaignsView === "list"){ state.campaignsView = "none"; render(); return; }
  }
  if(role === "admin"){
    if(state.adminSelectedPressingId){ state.adminSelectedPressingId = null; render(); return; }
    if(state.adminView === "pass" || state.adminView === "users" || state.adminView === "messages" || state.adminView === "cleanup"){ state.adminView = "pressings"; render(); return; }
  }
}
window.addEventListener("popstate", handlePopState);

// Points d'entrée "vers l'avant" qui doivent pouvoir être annulés par le bouton retour :
const _clientGo = clientGo;
clientGo = async function(screen){ pushNav(); return _clientGo(screen); };
const _bookingStep = bookingStep;
bookingStep = function(n){ if(n > (state.booking?.step||0)) pushNav(); return _bookingStep(n); };
const _setCampaignsView = setCampaignsView;
setCampaignsView = function(v){ if(v !== "none") pushNav(); return _setCampaignsView(v); };
const _openPressingConfig = openPressingConfig;
openPressingConfig = async function(){ pushNav(); return _openPressingConfig(); };
const _pressingSelect = pressingSelect;
pressingSelect = function(id){ pushNav(); return _pressingSelect(id); };
const _adminSelectPressing = adminSelectPressing;
adminSelectPressing = async function(id){ pushNav(); return _adminSelectPressing(id); };

window.addEventListener("error", function(ev){
  console.error("window error", ev.error || ev.message);
});
window.addEventListener("unhandledrejection", function(ev){
  console.error("unhandledrejection", ev.reason);
});
init();
</script>
